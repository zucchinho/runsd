name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Verify modules
        run: go mod tidy -diff && go mod verify
      - name: Build
        run: go build -o /dev/null ./runsd
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Tools module
        run: go -C tools mod tidy -diff && go -C tools mod verify
      - name: Actionlint
        run: go tool -modfile=tools/go.mod actionlint
      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
      # Catches misspelt or misplaced keys only; GitHub also rejects options a
      # given ecosystem does not support (e.g. semver-major-days on github-actions).
      - name: Dependabot config schema
        run: pipx run check-jsonschema==0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml
