name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Verify modules
        run: go mod tidy -diff && go mod verify
      - name: Build
        run: go build -o /dev/null ./runsd
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
