version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Conventional-commit prefixes, so PR titles pass the semantic-title check.
    # `fix` makes a merged dependency bump release a new patch version.
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: fix
    groups:
      non-breaking:
        update-types:
          - minor
          - patch
  # CI tools (govulncheck, actionlint) live in their own module, so bumping
  # them does not change runsd and must not release it: `ci`, not `fix`.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: ci
    groups:
      tools:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
